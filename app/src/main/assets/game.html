<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle India</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1117;font-family:Arial,sans-serif;color:#fff;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;background:#0008;border:1px solid #ffffff22;border-radius:10px;padding:7px 9px;font-weight:700}
#stats{left:10px;top:10px}#ammo{right:10px;top:10px;text-align:right}#zone{left:50%;top:10px;transform:translateX(-50%)}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;text-align:center;text-shadow:0 3px 8px #000;display:none}
#start{position:fixed;inset:0;background:radial-gradient(circle,#263f2c,#0a0f14);display:flex;align-items:center;justify-content:center;z-index:5}
.card{width:min(84vw,520px);padding:24px;border-radius:20px;background:#10171fee;text-align:center;border:1px solid #ffffff22}
h1{font-size:42px;margin:0 0 8px}.sub{opacity:.82;line-height:1.4}.startbtn{margin-top:18px;padding:13px 26px;border:0;border-radius:12px;background:#ff9e2c;font-size:20px;font-weight:900}
#controls{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:20px;bottom:20px;width:126px;height:126px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff30;pointer-events:auto}
#stick{position:absolute;left:43px;top:43px;width:40px;height:40px;border-radius:50%;background:#ffffff99}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0008;border:2px solid #ffffff33;font-weight:900;pointer-events:auto;user-select:none}
#fire{right:24px;bottom:28px;width:90px;height:90px;background:#b5232388}
#reload{right:126px;bottom:28px;width:58px;height:58px}
#med{right:120px;bottom:98px;width:58px;height:58px;font-size:11px}
#gun{right:28px;bottom:136px;width:64px;height:64px;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="card"><h1>BATTLE INDIA</h1><div class="sub">Survive enemy bots, collect loot, stay inside the safe zone and become the last survivor.</div><button id="play" class="startbtn">PLAY MATCH</button></div></div>
<div id="hud"><div id="stats" class="p">HP <span id="hp">100</span><br>Alive <span id="alive">16</span><br>Kills <span id="kills">0</span></div><div id="ammo" class="p"><span id="wp">AR</span><br><span id="am">30 / 120</span></div><div id="zone" class="p">ZONE <span id="zr">760</span>m</div><div id="msg"></div></div>
<div id="controls"><div id="joy"><div id="stick"></div></div><div id="fire" class="btn">FIRE</div><div id="reload" class="btn">R</div><div id="med" class="btn">MED</div><div id="gun" class="btn">GUN</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');function rs(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();
const U={hp:hp,alive:alive,kills:kills,am:am,wp:wp,zr:zr,msg:msg};let W=1800,Z=760,run=0,last=0,K=0,meds=2,next=0;
const P={x:900,y:900,r:18,hp:100,s:200,a:0,dead:0};let B=[],Q=[],L=[],O=[],joyv={x:0,y:0,on:0,id:null};
const guns=[{n:'AR',m:30,a:30,r:120,d:24,rate:.115,range:430,sp:.045},{n:'SMG',m:40,a:40,r:160,d:16,rate:.075,range:300,sp:.075}];let gi=0;
const rr=(a,b)=>a+Math.random()*(b-a),dd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function reset(){P.x=P.y=900;P.hp=100;P.dead=0;K=0;meds=2;Z=760;Q=[];L=[];B=[];O=[];guns[0].a=30;guns[0].r=120;guns[1].a=40;guns[1].r=160;gi=0;
for(let i=0;i<24;i++)O.push({x:rr(90,1710),y:rr(90,1710),w:rr(45,110),h:rr(45,110)});
for(let i=0;i<15;i++){let a=rr(0,Math.PI*2),d=rr(220,700);B.push({x:900+Math.cos(a)*d,y:900+Math.sin(a)*d,r:17,hp:100,s:rr(90,125),cd:rr(.2,1),dead:0,st:Math.random()<.5?-1:1})}
for(let i=0;i<28;i++)L.push({x:rr(100,1700),y:rr(100,1700),t:Math.random()<.7?'a':'m'});U.msg.style.display='none';run=1}
function shoot(bot,ang){if(!run)return;if(!bot){let g=guns[gi],n=performance.now()/1000;if(n<next||g.a<=0)return;next=n+g.rate;g.a--;ang+=rr(-g.sp,g.sp);Q.push({x:P.x,y:P.y,vx:Math.cos(ang)*760,vy:Math.sin(ang)*760,l:g.range/760,d:g.d,o:0})}else Q.push({x:bot.x,y:bot.y,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,l:.75,d:rr(7,12),o:bot})}
function reload(){let g=guns[gi],n=Math.min(g.m-g.a,g.r);g.a+=n;g.r-=n}
function heal(){if(meds>0&&P.hp<100&&!P.dead){meds--;P.hp=Math.min(100,P.hp+45)}}
function swap(){gi=(gi+1)%2}
function end(t){run=0;U.msg.innerHTML=t+'<br><button class="startbtn" onclick="reset()">PLAY AGAIN</button>';U.msg.style.display='block'}
function upd(dt){if(!run)return;let mx=joyv.x,my=joyv.y,l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}P.x=Math.max(25,Math.min(W-25,P.x+mx*P.s*dt));P.y=Math.max(25,Math.min(W-25,P.y+my*P.s*dt));if(l>.1)P.a=Math.atan2(my,mx);
let live=B.filter(b=>!b.dead);if(live.length){live.sort((a,b)=>dd(P,a)-dd(P,b));let a=live[0];if(dd(P,a)<450)P.a=Math.atan2(a.y-P.y,a.x-P.x)}
Z=Math.max(110,Z-1.25*dt);if(dd(P,{x:900,y:900})>Z){P.hp-=10*dt;if(P.hp<=0&&!P.dead){P.dead=1;end('ELIMINATED')}}
L=L.filter(o=>{if(dd(P,o)<32){if(o.t==='a')guns.forEach(g=>g.r+=25);else meds++;return 0}return 1});
for(const b of B){if(b.dead)continue;let dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;b.cd-=dt;if(d>150){b.x+=dx/d*b.s*dt;b.y+=dy/d*b.s*dt}else{b.x+=-dy/d*b.st*b.s*.5*dt;b.y+=dx/d*b.st*b.s*.5*dt}if(d<390&&b.cd<=0){shoot(b,Math.atan2(dy,dx)+rr(-.11,.11));b.cd=rr(.55,1.05)}if(dd(b,{x:900,y:900})>Z){b.hp-=7*dt;if(b.hp<=0)b.dead=1}}
for(const q of Q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(!q.o){for(const b of B)if(!b.dead&&dd(q,b)<b.r+5){b.hp-=q.d;q.l=0;if(b.hp<=0){b.dead=1;K++;if(Math.random()<.7)L.push({x:b.x,y:b.y,t:Math.random()<.75?'a':'m'})}break}}else if(!P.dead&&dd(q,P)<P.r+5){P.hp-=q.d;q.l=0;if(P.hp<=0){P.dead=1;end('ELIMINATED')}}}
Q=Q.filter(q=>q.l>0);if(B.every(b=>b.dead)&&!P.dead)end('WINNER WINNER!');
let g=guns[gi];U.hp.textContent=Math.max(0,Math.round(P.hp));U.alive.textContent=B.filter(b=>!b.dead).length+(P.dead?0:1);U.kills.textContent=K;U.wp.textContent=g.n+' • MED '+meds;U.am.textContent=g.a+' / '+g.r;U.zr.textContent=Math.round(Z)}
function draw(){let w=innerWidth,h=innerHeight,cx=P.x-w/2,cy=P.y-h/2;x.fillStyle='#335f38';x.fillRect(0,0,w,h);x.save();x.translate(-cx,-cy);x.strokeStyle='#ffffff0d';for(let n=0;n<=W;n+=90){x.beginPath();x.moveTo(n,0);x.lineTo(n,W);x.stroke();x.beginPath();x.moveTo(0,n);x.lineTo(W,n);x.stroke()}
x.save();x.fillStyle='#5a78ff30';x.fillRect(0,0,W,W);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(900,900,Z,0,7);x.fill();x.restore();x.strokeStyle='#7aa0ff';x.lineWidth=6;x.beginPath();x.arc(900,900,Z,0,7);x.stroke();
for(const o of O){x.fillStyle='#776a59';x.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}for(const l of L){x.fillStyle=l.t==='a'?'#f0cf4d':'#ed5268';x.fillRect(l.x-8,l.y-8,16,16)}
x.fillStyle='#ffe27a';for(const q of Q){x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}for(const b of B)if(!b.dead){x.fillStyle='#db5a50';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#151515';x.fillRect(b.x-20,b.y-28,40,5);x.fillStyle='#5ef06f';x.fillRect(b.x-20,b.y-28,40*Math.max(0,b.hp)/100,5)}
x.fillStyle='#51b9ff';x.beginPath();x.arc(P.x,P.y,P.r,0,7);x.fill();x.strokeStyle='white';x.lineWidth=4;x.beginPath();x.moveTo(P.x,P.y);x.lineTo(P.x+Math.cos(P.a)*32,P.y+Math.sin(P.a)*32);x.stroke();x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
play.onclick=()=>{start.style.display='none';reset()};
const j=document.getElementById('joy'),s=document.getElementById('stick');function jp(e){let r=j.getBoundingClientRect(),a=e.clientX-(r.left+r.width/2),b=e.clientY-(r.top+r.height/2),m=Math.hypot(a,b),lim=43,k=m>lim?lim/m:1;s.style.transform='translate('+a*k+'px,'+b*k+'px)';joyv.x=a/lim;joyv.y=b/lim;if(Math.hypot(joyv.x,joyv.y)>1){let z=Math.hypot(joyv.x,joyv.y);joyv.x/=z;joyv.y/=z}}
j.onpointerdown=e=>{joyv.on=1;joyv.id=e.pointerId;j.setPointerCapture(e.pointerId);jp(e)};j.onpointermove=e=>{if(joyv.on&&e.pointerId===joyv.id)jp(e)};j.onpointerup=j.onpointercancel=()=>{joyv.on=0;joyv.x=joyv.y=0;s.style.transform='translate(0,0)'};
let fh=0;fire.onpointerdown=e=>{fh=1;fire.setPointerCapture(e.pointerId)};fire.onpointerup=fire.onpointercancel=()=>fh=0;setInterval(()=>{if(fh&&!P.dead)shoot(0,P.a)},25);reload.onclick=()=>reload();med.onclick=()=>heal();gun.onclick=()=>swap();
</script></body></html>
